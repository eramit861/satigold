<!doctype html>
<html lang="__SITE_LANGUAGE__">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

        <!-- Primary SEO -->
        <title>__SITE_TITLE__</title>
        <meta name="description" content="__SITE_DESCRIPTION__" />
        <meta name="keywords" content="__SITE_KEYWORDS__" />
        <meta name="author" content="__SITE_NAME__" />
        <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
        <link rel="canonical" href="__SITE_URL__" />
        <meta name="theme-color" content="__THEME_COLOR__" />
        <meta name="format-detection" content="telephone=yes" />

        <!-- Local SEO -->
        <meta name="geo.region" content="__GEO_REGION__" />
        <meta name="geo.placename" content="__GEO_PLACENAME__" />

        <!-- Open Graph (Facebook, WhatsApp, LinkedIn) -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="__SITE_PRODUCT_NAME__" />
        <meta property="og:locale" content="__SITE_LOCALE__" />
        <meta property="og:url" content="__SITE_URL__" />
        <meta property="og:title" content="__SITE_TITLE__" />
        <meta property="og:description" content="__SITE_DESCRIPTION__" />
        <meta property="og:image" content="__OG_IMAGE__" />
        <meta property="og:image:secure_url" content="__OG_IMAGE__" />
        <meta property="og:image:type" content="image/jpeg" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:image:alt" content="__OG_IMAGE_ALT__" />

        <!-- Twitter / X -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="__SITE_TITLE__" />
        <meta name="twitter:description" content="__SITE_DESCRIPTION__" />
        <meta name="twitter:image" content="__OG_IMAGE__" />
        <meta name="twitter:image:alt" content="__OG_IMAGE_ALT__" />

        <!-- Icons & manifest -->
        <link rel="icon" href="/favicon.ico" sizes="any" />
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
        <link rel="manifest" href="/site.webmanifest" />

        <!--
            Hero image (LCP on desktop) - keep in sync with src/components/Hero.jsx.
            Below 901px the image stacks under the fold and the hero text is the LCP,
            so it is not preloaded there and does not compete with the fonts.
        -->
        <link
            rel="preload"
            as="image"
            media="(min-width: 901px)"
            type="image/webp"
            href="/images/hero-jar.webp"
            imagesrcset="/images/hero-jar-480.webp 480w, /images/hero-jar-500.webp 500w, /images/hero-jar-640.webp 640w, /images/hero-jar.webp 760w"
            imagesizes="(max-width: 900px) calc(min(420px, 88vw) - 16px), 484px"
            fetchpriority="high"
        />

        <!-- Fonts are self-hosted (src/styles/fonts.css); the build inlines the CSS and preloads the hero fonts. -->

        <!-- Structured data (generated from src/config/site.js + src/data/content.js) -->
        <script type="application/ld+json">__STRUCTURED_DATA__</script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
