<!doctype html>
<html lang="__SITE_LANGUAGE__">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

        <!-- Primary SEO -->
        <title>__SITE_TITLE__</title>
        <meta name="description" content="__SITE_DESCRIPTION__" />
        <meta name="keywords" content="__SITE_KEYWORDS__" />
        <meta name="author" content="__SITE_NAME__" />
        <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
        <link rel="canonical" href="__SITE_URL__" />
        <meta name="theme-color" content="__THEME_COLOR__" />
        <meta name="format-detection" content="telephone=yes" />

        <!-- Local SEO -->
        <meta name="geo.region" content="__GEO_REGION__" />
        <meta name="geo.placename" content="__GEO_PLACENAME__" />

        <!-- Open Graph (Facebook, WhatsApp, LinkedIn) -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="__SITE_PRODUCT_NAME__" />
        <meta property="og:locale" content="__SITE_LOCALE__" />
        <meta property="og:url" content="__SITE_URL__" />
        <meta property="og:title" content="__SITE_TITLE__" />
        <meta property="og:description" content="__SITE_DESCRIPTION__" />
        <meta property="og:image" content="__OG_IMAGE__" />
        <meta property="og:image:secure_url" content="__OG_IMAGE__" />
        <meta property="og:image:type" content="image/jpeg" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:image:alt" content="__OG_IMAGE_ALT__" />

        <!-- Twitter / X -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="__SITE_TITLE__" />
        <meta name="twitter:description" content="__SITE_DESCRIPTION__" />
        <meta name="twitter:image" content="__OG_IMAGE__" />
        <meta name="twitter:image:alt" content="__OG_IMAGE_ALT__" />

        <!-- Icons & manifest -->
        <link rel="icon" href="/favicon.ico" sizes="any" />
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
        <link rel="manifest" href="/site.webmanifest" />

        <!-- Hero image (LCP) - keep in sync with src/components/Hero.jsx -->
        <link
            rel="preload"
            as="image"
            type="image/webp"
            href="/images/hero-jar.webp"
            imagesrcset="/images/hero-jar-480.webp 480w, /images/hero-jar.webp 760w"
            imagesizes="(max-width: 900px) 88vw, 520px"
            fetchpriority="high"
        />

        <!-- Fonts (non-render-blocking) -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@500;600;700&family=Noto+Sans+Devanagari:wght@500;600&display=swap"
            media="print"
            onload="this.media='all'"
        />
        <noscript>
            <link
                rel="stylesheet"
                href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@500;600;700&family=Noto+Sans+Devanagari:wght@500;600&display=swap"
            />
        </noscript>

        <!-- Structured data (generated from src/config/site.js + src/data/content.js) -->
        <script type="application/ld+json">__STRUCTURED_DATA__</script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
